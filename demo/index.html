<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>react-progressive-picture</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0d12;
        color: #e6e8ee;
      }

      main {
        width: min(760px, 92vw);
      }

      h1 {
        margin: 0 0 0.25rem;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0 0 1rem;
        font-size: 0.8125rem;
        color: #8b93a7;
      }

      #root .rpp-root {
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>react-progressive-picture</h1>
      <p>Blurred 30px placeholder &rarr; full image, on load.</p>
      <div id="root"></div>
    </main>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
