name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC) and for provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Trusted publishing needs npm >= 11.5.1, newer than what setup-node bundles.
      - run: npm install -g npm@latest
      # prepublishOnly runs lint, typecheck, test and build before anything is uploaded.
      - run: npm publish --access public --provenance
